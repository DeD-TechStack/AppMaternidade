name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    name: Verificar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5
        with:
          # Histórico completo: o verificar-commits percorre o intervalo desde a base.
          fetch-depth: 0
          # Na pull_request, usa a cabeça da PR e não o commit de merge; no push fica vazio
          # e o checkout usa o commit do push.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Instalar o Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Instalar as dependências do site
        working-directory: web
        run: npm ci

      - name: Verificar o site (typecheck, lint, test, build)
        working-directory: web
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            google-chrome --version
            printf '<!doctype html><pre id=g>ok</pre><script>document.fonts.ready.then(()=>{document.getElementById("g").textContent="pronto"})</script>' > /tmp/min.html
            for flags in "--virtual-time-budget=3000" ""; do
              echo "TRIV flags=[$flags]"; s=$(date +%s)
              timeout 25 google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir=/tmp/p$RANDOM $flags --dump-dom file:///tmp/min.html | head -c 300; echo " exit=$? secs=$(( $(date +%s) - s ))"
              pkill -9 chrome || true
            done
            ( while true; do echo "MON $(date +%T) $(free -m | sed -n 2p) | $(ps -eo rss,pid,etimes,args --sort=-rss | grep -i '[c]hrome' | sed -n 1,4p | cut -c1-170 | tr '\n' ';')"; sleep 5; done ) &
            npm run build
            npx vitest run src/componentes/casca/geometria.test.tsx
          else
            npm run check
          fi

      # Diagnóstico só no ubuntu e só quando o passo anterior falha ou é cancelado: discrimina OOM, Chrome
      # que ficou vivo e excesso de workers do vitest no "Killed" visto na geometria (CI-GEO).
      - name: Diagnóstico do runner (ubuntu, só em falha)
        if: ${{ (failure() || cancelled()) && runner.os == 'Linux' }}
        continue-on-error: true
        run: |
          echo "== memória (free -m)"; free -m || true
          echo "== OOM no kernel (dmesg/journal)"; (dmesg 2>/dev/null || sudo -n dmesg 2>/dev/null || journalctl -k --no-pager 2>/dev/null || true) | grep -iE 'out of memory|oom|killed process' | tail -n 20 || true
          echo "== árvore de processos chrome/node"; ps -eo pid,ppid,pgid,rss,etimes,stat,args --sort=-rss | grep -Ei 'chrome|chromium|node|vitest' | grep -v grep | head -n 40 || true
          echo "== workers do vitest"; echo "node: $(pgrep -fc 'vitest' || true) | chrome: $(pgrep -fc 'chrome|chromium' || true) | nproc: $(nproc)"
          echo "== cgroup"; cat /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.max 2>/dev/null || true

      - name: Testar o script da política de commits
        run: node --test scripts/verificar-commits.test.mjs

      # A base é fixa: os commits até ela não seguem esta política (dois títulos passam
      # de 72 caracteres), e o mesmo intervalo vale em todo push e na PR.
      - name: Verificar a política de commits desde a base
        run: node scripts/verificar-commits.mjs c7142bb43b763216fa124d101aa0b020f4d26e08..HEAD

  banco:
    name: Banco (Supabase local)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar o Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Instalar as dependências
        run: npm ci

      - name: Subir o Supabase local
        run: npm run db:start

      - name: Testar o banco (pgTAP)
        run: npm run db:test

      - name: Verificar o banco (lint)
        run: npm run db:lint
