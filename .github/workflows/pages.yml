name: Pages

# O Pages serve um único artefato: a main na raiz e o int/refazer em previa/.
# A prévia é publicada quando o CI de um push no int/refazer deste repositório termina com sucesso.
# O workflow_run sempre roda o arquivo da branch padrão, então este arquivo precisa estar na main.
on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "scripts/montar-pages.mjs"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - int/refazer
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Construir o site
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'int/refazer' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'push')
    permissions:
      contents: read
      pages: read
    steps:
      # A raiz é sempre a main: no push, o commit do próprio evento; nos outros eventos, a ponta da main.
      - name: Baixar o código
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}

      - name: Instalar o Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Configurar o Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Explicar a falha do Pages
        if: failure() && steps.pages.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          saida=$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>&1) || true
          if [[ "$saida" == *"HTTP 404"* ]]; then
            echo "::error title=Pages não ativado::Ative em Settings > Pages > Source: GitHub Actions e rode o workflow de novo."
          else
            echo "::error title=configure-pages falhou::$saida"
          fi

      - name: Instalar as dependências do site
        working-directory: web
        run: npm ci

      - name: Verificar o site (typecheck, lint, test, build)
        working-directory: web
        run: npm run check

      # O build incorpora a URL pública e a chave pública anon/publishable no cliente.
      # Use os dois secrets do repositório; os secrets do ambiente github-pages só chegam ao job publicar.
      # Nunca use uma chave privilegiada (service_role ou sb_secret).
      # O par atual é compartilhado apenas quando raiz e prévia têm a mesma fronteira de confiança.
      # Se a confiança for diferente, use bindings separados e explícitos; a prévia jamais deve
      # recorrer à configuração de produção por padrão. Sem configuração compartilhável, deixe o par vazio.
      - name: Gerar o build com o subcaminho do Pages
        working-directory: web
        env:
          BASE_SITE: ${{ steps.pages.outputs.base_path }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          node -e '
            const temUrl = Boolean(process.env.VITE_SUPABASE_URL)
            const temChave = Boolean(process.env.VITE_SUPABASE_ANON_KEY)
            if (temUrl !== temChave) {
              console.error("::error::Configuração incompleta do Supabase para a raiz. Defina as duas variáveis públicas ou nenhuma.")
              process.exit(1)
            }
            if (!temUrl) console.log("::notice::Build da raiz em modo demonstração.")
          ' && npm run build

      # Prévia: o int/refazer num segundo checkout. No workflow_run, o commit que o CI testou.
      - name: Baixar o código da prévia
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'int/refazer' }}
          path: previa-src

      - name: Registrar o commit da prévia
        id: sha_previa
        run: echo "sha=$(git -C previa-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Instalar as dependências da prévia
        working-directory: previa-src/web
        run: npm ci

      # O CI do int/refazer já verificou o commit; só o disparo manual não passou por ele.
      - name: Avisar que a verificação da prévia foi pulada
        if: github.event_name != 'workflow_run'
        run: echo "A prévia não roda npm run check aqui; a verificação do int/refazer é a do CI."

      - name: Gerar o build da prévia no subcaminho previa
        working-directory: previa-src/web
        env:
          BASE_SITE: ${{ steps.pages.outputs.base_path }}/previa
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          node -e '
            const temUrl = Boolean(process.env.VITE_SUPABASE_URL)
            const temChave = Boolean(process.env.VITE_SUPABASE_ANON_KEY)
            if (temUrl !== temChave) {
              console.error("::error::Configuração incompleta do Supabase para a prévia. Defina as duas variáveis públicas ou nenhuma.")
              process.exit(1)
            }
            if (!temUrl) console.log("::notice::Build da prévia em modo demonstração.")
          ' && npm run build

      - name: Montar o artefato do Pages
        run: >-
          node scripts/montar-pages.mjs
          --raiz web/dist
          --previa previa-src/web/dist
          --saida _site
          --sha "${{ steps.sha_previa.outputs.sha }}"
          --rotas previa-src/web/src

      - name: Enviar o site para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    name: Publicar no Pages
    needs: construir
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: publicar
        uses: actions/deploy-pages@v4
